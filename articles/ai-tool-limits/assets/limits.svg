<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 388" width="1024" height="388" role="img" aria-labelledby="title desc">
<title id="title">価格改定より先に、判断への影響を見る</title><desc id="desc">変化した事実と、そこから導く推奨は別に検証する</desc>
<rect x="0" y="0" width="1024" height="388" rx="24" fill="#F7F9FC"/>
<rect x="0" y="0" width="1024" height="6" rx="3" fill="#2459A5"/>
<text x="38" y="47" font-size="26" font-weight="700" fill="#0F172A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">価格改定より先に、判断への影響を見る</text>
<text x="38" y="77" font-size="15" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">変化した事実と、そこから導く推奨は別に検証する</text>
<rect x="34" y="120" width="292" height="177" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="34" y="120" width="6" height="177" rx="3" fill="#2459A5"/><text x="54" y="149" font-size="12" fill="#2459A5" font-weight="700" font-family="sans-serif">01</text><text x="54" y="180" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">事実の変化</text><text x="54" y="214" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">価格・上限・機能</text><text x="54" y="240" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">出典と確認日</text><line x1="338" y1="210" x2="350" y2="210" stroke="#2459A5" stroke-width="2.6"/><polyline points="352,203 363,210 352,217" fill="none" stroke="#2459A5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="371" y="120" width="292" height="177" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="371" y="120" width="6" height="177" rx="3" fill="#B55719"/><text x="391" y="149" font-size="12" fill="#B55719" font-weight="700" font-family="sans-serif">02</text><text x="391" y="180" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">利用条件の変化</text><text x="391" y="214" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">タスク量・並列数</text><text x="391" y="240" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">停止後の代替手段</text><line x1="675" y1="210" x2="686" y2="210" stroke="#2459A5" stroke-width="2.6"/><polyline points="688,203 699,210 688,217" fill="none" stroke="#2459A5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="707" y="120" width="282" height="177" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="707" y="120" width="6" height="177" rx="3" fill="#106B59"/><text x="727" y="149" font-size="12" fill="#106B59" font-weight="700" font-family="sans-serif">03</text><text x="727" y="180" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">判断を再検討</text><text x="727" y="214" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">費用と手戻りを比較</text><text x="727" y="240" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">結論を改訂するか</text>
<text x="38" y="365" font-size="13" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">数字を持たない説明図。価格・上限の履歴を示すグラフではない</text>
</svg>
