<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 388" width="1024" height="388" role="img" aria-labelledby="title desc">
<title id="title">並列化は「実行」だけで終わらない</title><desc id="desc">独立した仕事に分け、結果を統合して初めて完了</desc>
<rect x="0" y="0" width="1024" height="388" rx="24" fill="#F7F9FC"/>
<rect x="0" y="0" width="1024" height="6" rx="3" fill="#2459A5"/>
<text x="38" y="47" font-size="26" font-weight="700" fill="#0F172A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">並列化は「実行」だけで終わらない</text>
<text x="38" y="77" font-size="15" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">独立した仕事に分け、結果を統合して初めて完了</text>
<rect x="35" y="111" width="226" height="182" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="35" y="111" width="6" height="182" rx="3" fill="#2459A5"/><text x="55" y="140" font-size="12" fill="#2459A5" font-weight="700" font-family="sans-serif">01</text><text x="55" y="171" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">仕事を分割</text><text x="55" y="205" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">変更範囲を決める</text><text x="55" y="231" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">成功条件を決める</text><line x1="271" y1="198" x2="306" y2="198" stroke="#2459A5" stroke-width="2.6"/><polyline points="308,191 319,198 308,205" fill="none" stroke="#2459A5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="323" y="112" width="227" height="77" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="323" y="112" width="6" height="77" rx="3" fill="#106B59"/><text x="343" y="154" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">作業A</text><rect x="323" y="211" width="227" height="77" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="323" y="211" width="6" height="77" rx="3" fill="#106B59"/><text x="343" y="253" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">作業B</text><path d="M289 198 L302 198 L302 150 L312 150 M302 198 L302 250 L312 250" fill="none" stroke="#2459A5" stroke-width="2.5"/><path d="M560 150 L586 150 L586 198 L600 198 M560 250 L586 250" fill="none" stroke="#106B59" stroke-width="2.5"/><line x1="604" y1="198" x2="632" y2="198" stroke="#2459A5" stroke-width="2.6"/><polyline points="634,191 645,198 634,205" fill="none" stroke="#2459A5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="649" y="111" width="340" height="182" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="649" y="111" width="6" height="182" rx="3" fill="#B55719"/><text x="669" y="140" font-size="12" fill="#B55719" font-weight="700" font-family="sans-serif">02</text><text x="669" y="171" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">統合・検証</text><text x="669" y="205" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">競合・手戻りも計測</text><text x="669" y="231" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">レビューとテストまで含む</text>
<text x="38" y="365" font-size="13" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">実測グラフではない。比較条件と結果は別途記録する</text>
</svg>
