<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 388" width="1024" height="388" role="img" aria-labelledby="title desc">
<title id="title">月額予算を3つの役割に分ける</title><desc id="desc">料金だけでなく、仕事を継続できるかで判断する</desc>
<rect x="0" y="0" width="1024" height="388" rx="24" fill="#F7F9FC"/>
<rect x="0" y="0" width="1024" height="6" rx="3" fill="#2459A5"/>
<text x="38" y="47" font-size="26" font-weight="700" fill="#0F172A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">月額予算を3つの役割に分ける</text>
<text x="38" y="77" font-size="15" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">料金だけでなく、仕事を継続できるかで判断する</text>
<rect x="36" y="120" width="283" height="175" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="36" y="120" width="6" height="175" rx="3" fill="#2459A5"/><text x="56" y="149" font-size="12" fill="#2459A5" font-weight="700" font-family="sans-serif">01</text><text x="56" y="180" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">主力</text><text x="56" y="214" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">毎日の仕事を処理</text><text x="56" y="240" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">利用上限を確認</text><line x1="329" y1="209" x2="353" y2="209" stroke="#2459A5" stroke-width="2.6"/><polyline points="355,202 366,209 355,216" fill="none" stroke="#2459A5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="371" y="120" width="283" height="175" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="371" y="120" width="6" height="175" rx="3" fill="#106B59"/><text x="391" y="149" font-size="12" fill="#106B59" font-weight="700" font-family="sans-serif">02</text><text x="391" y="180" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">追加利用</text><text x="391" y="214" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">上限到達後の継続</text><text x="391" y="240" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">従量課金と切替</text><line x1="664" y1="209" x2="688" y2="209" stroke="#2459A5" stroke-width="2.6"/><polyline points="690,202 701,209 690,216" fill="none" stroke="#2459A5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="706" y="120" width="283" height="175" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="706" y="120" width="6" height="175" rx="3" fill="#B55719"/><text x="726" y="149" font-size="12" fill="#B55719" font-weight="700" font-family="sans-serif">03</text><text x="726" y="180" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">予備</text><text x="726" y="214" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">障害や失敗への備え</text><text x="726" y="240" font-size="17" fill="#51617A" font-family="Noto Sans JP,Hiragino Sans,sans-serif">使わない費用も確認</text>
<text x="38" y="365" font-size="13" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">※ 金額・最適なサービスの比較結果ではなく、選定の構造を示す模式図</text>
</svg>
