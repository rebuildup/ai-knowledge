<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 388" width="1024" height="388" role="img" aria-labelledby="title desc">
<title id="title">CLIとMCPの違いは、接続の境界</title><desc id="desc">同じ外部操作でも、どこからどう呼ぶかが違う</desc>
<rect x="0" y="0" width="1024" height="388" rx="24" fill="#F7F9FC"/>
<rect x="0" y="0" width="1024" height="6" rx="3" fill="#2459A5"/>
<text x="38" y="47" font-size="26" font-weight="700" fill="#0F172A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">CLIとMCPの違いは、接続の境界</text>
<text x="38" y="77" font-size="15" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">同じ外部操作でも、どこからどう呼ぶかが違う</text>
<text x="40" y="119" font-size="18" font-weight="700" fill="#2459A5" font-family="sans-serif">CLI</text><rect x="126" y="92" width="280" height="96" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="126" y="92" width="6" height="96" rx="3" fill="#2459A5"/><text x="146" y="134" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">Terminal / Script</text><line x1="418" y1="141" x2="488" y2="141" stroke="#2459A5" stroke-width="2.6"/><polyline points="490,134 501,141 490,148" fill="none" stroke="#2459A5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="513" y="92" width="463" height="96" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="513" y="92" width="6" height="96" rx="3" fill="#2459A5"/><text x="533" y="134" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">CLI command → External API</text><text x="40" y="251" font-size="18" font-weight="700" fill="#106B59" font-family="sans-serif">MCP</text><rect x="126" y="219" width="227" height="96" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="126" y="219" width="6" height="96" rx="3" fill="#106B59"/><text x="146" y="261" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">AI Host / Client</text><line x1="365" y1="267" x2="403" y2="267" stroke="#106B59" stroke-width="2.6"/><polyline points="405,260 416,267 405,274" fill="none" stroke="#106B59" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="427" y="219" width="218" height="96" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="427" y="219" width="6" height="96" rx="3" fill="#106B59"/><text x="447" y="261" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">MCP Server</text><line x1="657" y1="267" x2="701" y2="267" stroke="#106B59" stroke-width="2.6"/><polyline points="703,260 714,267 703,274" fill="none" stroke="#106B59" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="726" y="219" width="250" height="96" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/><rect x="726" y="219" width="6" height="96" rx="3" fill="#106B59"/><text x="746" y="261" font-size="21" fill="#0F172A" font-weight="700" font-family="Noto Sans JP,Hiragino Sans,sans-serif">External API</text>
<text x="38" y="365" font-size="13" fill="#51617A" font-family="Noto Sans JP, Hiragino Sans, sans-serif">MCPはツール等を共有するプロトコル。CLIと目的が重なっても同じ仕組みではない</text>
</svg>
