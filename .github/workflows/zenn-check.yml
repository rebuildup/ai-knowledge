name: Zenn export checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install -r requirements-zenn.txt
      - name: Run export tests
        run: python -m unittest discover -s scripts -p 'test_export_zenn.py' -v
      - name: Verify export
        run: |
          python scripts/export_zenn.py
          python scripts/export_zenn.py --check
