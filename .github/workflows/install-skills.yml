name: Install writing skills via CLI

on:
  pull_request:
    paths:
      - .github/workflows/install-skills.yml
      - scripts/install-skills.sh

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install skills with official CLI
        run: bash scripts/install-skills.sh
      - name: Confirm editorial tooling
        run: |
          python3 scripts/editorial_check.py
          python3 .agents/skills/yomiyasu/scripts/yomiyasu_lint.py --help > /dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for name in ("natural-japanese", "yomiyasu"):
              for f in Path(".agents/skills", name, "scripts").glob("*.py"):
                  ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
          PY
      - name: Commit CLI-managed installation to PR
        run: |
          git add -A
          # Upstream skill files include trailing blank lines; do not rewrite third-party content.
          git -c core.whitespace=blank-at-eol,space-before-tab diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "skills CLIで執筆スキルを再導入"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
